[project]
name = "churnmap"
version = "1.0.0"
description = "Coupling heatmap generator — visualize co-change risk in any git repo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Meru143" },
]
keywords = ["coupling", "git", "code-quality", "heatmap", "visualization", "d3"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "coupling-core>=1.0,<2.0",
    "typer>=0.26.0",
    "rich>=15.0.0",
    "Jinja2>=3.1.6",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.1.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "pip-audit>=2.7",
    "python-semantic-release>=9,<10",
]

[project.urls]
Homepage = "https://github.com/Meru143/churnmap"
Repository = "https://github.com/Meru143/churnmap"
Issues = "https://github.com/Meru143/churnmap/issues"
Changelog = "https://github.com/Meru143/churnmap/blob/main/CHANGELOG.md"

[project.scripts]
churnmap = "churnmap.main:app"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnmap"]
include = ["src/churnmap/templates/*"]

[tool.hatch.build.targets.sdist]
include = [
    "src/churnmap",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/churnmap"]

[[tool.mypy.overrides]]
module = ["coupling_core.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/churnmap"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/churnmap/__init__.py:__version__"]
branch = "main"
allow_zero_version = false
upload_to_pypi = true
build_command = "python -m build"
commit_parser = "semantic_release.commit_parser.conventional:ConventionalCommitParser"

[tool.semantic_release.publish]
upload_to_vcs_release = true
